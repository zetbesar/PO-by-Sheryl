<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Order Sheryl Boutique</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #f5efe6; /* Warna earth tone lembut */
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: #ffffff; 
            max-width: 450px; 
            width: 100%; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            box-sizing: border-box;
            border: 1px solid #e4dccc;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 22px; color: #5d4037; margin: 0; } /* Brown elegan */
        .header p { font-size: 13px; color: #8d6e63; }
        
        label { font-size: 13px; font-weight: 600; display: block; margin-top: 15px; color: #4e342e; }
        
        input, select, textarea { 
            width: 100%; padding: 12px; margin-top: 8px; 
            border: 1px solid #d7ccc8; border-radius: 10px; 
            font-family: 'Poppins', sans-serif; font-size: 14px; 
            box-sizing: border-box; background-color: #faf9f6; 
        }
        
        .detail-text { font-size: 11px; color: #795548; margin-top: 5px; font-style: italic; }
        
        button { 
            width: 100%; padding: 15px; margin-top: 30px; 
            background-color: #5d4037; /* Brown tua untuk tombol */
            color: white; border: none; border-radius: 10px; 
            font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; 
        }
        button:hover { background-color: #3e2723; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>✨ Pre-Order Batch 2 ✨</h1>
            <p>Silakan isi data pesanan kamu ya!</p>
        </div>

        <form name="submit-to-google-sheet">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" placeholder="Contoh: SHXO" required>

            <label>Nomor WhatsApp</label>
            <input type="number" name="wa" placeholder="Contoh: 08123456789" required>

            <label>Pilihan Produk</label>
            <select name="produk" id="produk" onchange="toggleWarna()" required>
                <option value="Single Necklace (219K)">Single Necklace - 219K</option>
                <option value="Bundling Necklace (399K)">Bundling Necklace - 399K</option>
            </select>
            <div class="detail-text">
                <b>Single:</b> Necklace, 1 Tato XO, 2 Stiker, Pouch, Packaging.<br>
                <b>Bundling:</b> 2 Necklace, 2 Tato XO, 6 Stiker, Pouch, Packaging.
            </div>

            <div id="pilihanSingle">
                <label>Warna Necklace</label>
                <select name="warnaSingle">
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                </select>
            </div>

            <div id="pilihanBundling" style="display:none;">
                <label>Warna Necklace 1</label>
                <select name="warna1">
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                </select>
                <label>Warna Necklace 2</label>
                <select name="warna2">
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                </select>
            </div>

            <label>Alamat Jalan/Detail (Patokan)</label>
            <input type="text" name="alamatDetail" placeholder="Contoh: Jl. ABC No. 123" required>
            <div class="detail-text" style="margin-bottom: 10px;">
                *Isikan alamat lengkap agar admin mudah cek ongkir ke tempatmu ya!
            </div>

            <label>Kota / Kabupaten</label>
            <input type="text" name="kota" placeholder="Contoh: Bandung" required>

            <label>Kecamatan</label>
            <input type="text" name="kecamatan" placeholder="Contoh: Cicendo" required>

            <label>Kelurahan</label>
            <input type="text" name="kelurahan" placeholder="Contoh: Pasirkaliki" required>

            <label>Kode Pos</label>
            <input type="number" name="kodepos" placeholder="Contoh: 40171" required>

            <button type="submit" id="btnSubmit">Kirim Pesanan Sekarang</button>
        </form>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby_u2ojp_RvFYeH5zSOqifFig5EUdTK4g3-gBIAHWwYrLe5B3_y3B3h15jpYJv1xWRATA/exec';
        const form = document.forms['submit-to-google-sheet'];
        const btnSubmit = document.getElementById('btnSubmit');

        function toggleWarna() {
            var produk = document.getElementById("produk").value;
            if (produk === "Bundling Necklace (399K)") {
                document.getElementById("pilihanBundling").style.display = "block";
                document.getElementById("pilihanSingle").style.display = "none";
            } else {
                document.getElementById("pilihanBundling").style.display = "none";
                document.getElementById("pilihanSingle").style.display = "block";
            }
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnSubmit.innerHTML = 'Memproses... ⏳';
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('Yey! Pesanan berhasil. Admin akan segera menghubungi WA kamu.');
                    form.reset();
                    btnSubmit.innerHTML = 'Kirim Pesanan Sekarang';
                    toggleWarna();
                })
                .catch(error => {
                    alert('Waduh, error. Coba lagi ya!');
                    btnSubmit.innerHTML = 'Kirim Pesanan Sekarang';
                });
        });
    </script>
</body>
</html>
